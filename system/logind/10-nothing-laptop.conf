# Installed to /etc/systemd/logind.conf.d/ by install.sh on laptops.
# The power key opens the Nothing power menu (Hyprland binds XF86PowerOff) instead of
# logind powering off instantly — Plasma does the same with its own logout screen.
# Holding the key still forces a hardware power-off. Lid close → suspend (logind default).
[Login]
HandlePowerKey=ignore
