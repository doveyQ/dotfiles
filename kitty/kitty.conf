# ┏┓╻┏━┓╺┳╸╻ ╻╻┏┓╻┏━╸  kitty — Nothing OS monochrome
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
font_size         12.0
disable_ligatures never

window_padding_width 14 18
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.92
background_blur    0
dynamic_background_opacity yes

cursor_shape        block
cursor_blink_interval 0.6
cursor_trail        3
cursor_trail_decay  0.1 0.3
scrollback_lines    10000
enable_audio_bell   no
visual_bell_duration 0.08
visual_bell_color   #d71921
url_color           #ffffff
url_style           dotted

# tabs as dot-matrix pills
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style round
tab_bar_min_tabs    2
tab_title_template  " {index} {title} "
active_tab_foreground   #000000
active_tab_background   #ffffff
active_tab_font_style   bold
inactive_tab_foreground #8a8a8a
inactive_tab_background #141414
tab_bar_background      #000000

# ── palette: deep black, crisp white, greys, one red ──
foreground            #e8e8e8
background            #000000
selection_foreground  #000000
selection_background  #ffffff
cursor                #ffffff
cursor_text_color     #000000
active_border_color   #ffffff
inactive_border_color #333333
mark1_background      #d71921

# black
color0  #121212
color8  #4a4a4a
# red — the only colour
color1  #d71921
color9  #ff2a2a
# green → light grey
color2  #c8c8c8
color10 #e0e0e0
# yellow → white-ish
color3  #f0f0f0
color11 #ffffff
# blue → mid grey
color4  #9a9a9a
color12 #b5b5b5
# magenta → red tint
color5  #b8b8b8
color13 #ff5a5f
# cyan → grey
color6  #a8a8a8
color14 #cfcfcf
# white
color7  #d6d6d6
color15 #ffffff

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
