# kitty — macOS Terminal look.  Font + colours (light / dark): ~/.config/hypr/theme/kitty.conf
include ~/.config/hypr/theme/kitty.conf

bold_font         auto
italic_font       auto
font_size         12.0
disable_ligatures never
modify_font       cell_height 112%
# your terminal font size (Settings → Appearance → Fonts) — comes last, so it wins
include ~/.config/nothing/kitty.conf

window_padding_width 14 18
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.90
background_blur    0
dynamic_background_opacity yes

cursor_shape        beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.6
cursor_trail        3
cursor_trail_decay  0.1 0.3
scrollback_lines    10000
enable_audio_bell   no
visual_bell_duration 0.08
url_style           curly

# tabs as soft rounded pills
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style round
tab_bar_min_tabs    2
tab_title_template  " {index} {title} "
active_tab_font_style   normal

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
