<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SF font fallbacks (hypr/themes/fonts.conf) -->
<fontconfig>
  <include ignore_missing="yes">~/.config/hypr/themes/fonts.conf</include>
  <!-- your interface font (Settings → Appearance → Fonts), if you picked one other than SF Pro -->
  <include ignore_missing="yes">~/.config/nothing/fonts.conf</include>
</fontconfig>
