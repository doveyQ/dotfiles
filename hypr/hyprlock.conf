# ┏┓╻┏━┓╺┳╸╻ ╻╻┏┓╻┏━╸   hyprlock — Nothing OS lock screen
# ┃┗┫┃ ┃ ┃ ┣━┫┃┃┗┫┃╺┓   The ONLY locker: hypridle and every keybind call
# ╹ ╹┗━┛ ╹ ╹ ╹╹╹ ╹┗━┛   `loginctl lock-session` → hypridle → hyprlock.

$font_dot  = Ndot 57,
$font_dot2 = Ndot 55,
$font_ui   = Inter
$scripts   = ~/.config/hypr/scripts

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = nothing, 0.2, 0.9, 0.1, 1
    animation = fadeIn, 1, 4, nothing
    animation = fadeOut, 1, 3, nothing
    animation = inputFieldDots, 1, 2, nothing
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.02
    brightness = 0.35
    contrast = 1.0
    vibrancy = 0
}

# ── top: red dot + "LOCKED" ─────────────────────────────
label {
    monitor =
    text = <span foreground="##d71921">●</span>  LOCKED
    font_family = $font_dot2
    font_size = 14
    color = rgba(ffffffcc)
    position = 0, -60
    halign = center
    valign = top
}

# ── giant dot-matrix clock ─────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = $font_dot
    font_size = 168
    color = rgba(ffffffff)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000088)
    position = 0, 190
    halign = center
    valign = center
}

# ── date ─────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B" | tr '[:lower:]' '[:upper:]'
    font_family = $font_dot2
    font_size = 18
    color = rgba(ffffffb3)
    position = 0, 40
    halign = center
    valign = center
}

# ── greeting ─────────────────────────────
label {
    monitor =
    text = HELLO, $USER
    font_family = $font_ui
    font_size = 13
    color = rgba(ffffff80)
    position = 0, -34
    halign = center
    valign = center
}

# ── password pill (red accents) ─────────────────────────────
shape {
    monitor =
    size = 380, 64
    rounding = -1
    color = rgba(14141499)
    border_size = 1
    border_color = rgba(ffffff14)
    position = 0, -110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 52
    rounding = -1
    outline_thickness = 2
    outer_color = rgba(00000000)
    inner_color = rgba(0a0a0add)
    font_color = rgba(ffffffff)
    font_family = $font_ui
    check_color = rgba(ffffffcc)
    fail_color = rgba(d71921ff)
    capslock_color = rgba(d71921ff)
    numlock_color = rgba(00000000)
    bothlock_color = rgba(d71921ff)
    dots_size = 0.26
    dots_spacing = 0.55
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span font_family="Ndot 55" foreground="##8a8a8a">ENTER PASSWORD</span>
    fail_text = <span font_family="Ndot 55" foreground="##d71921">● WRONG · $ATTEMPTS</span>
    hide_input = false
    position = 0, -110
    halign = center
    valign = center
}

# ── keyboard layout chip (shows "at" — nodeadkeys) ─────────────────────────────
label {
    monitor =
    text = 󰌌  $LAYOUT
    font_family = $font_dot2
    font_size = 11
    color = rgba(ffffff80)
    position = 0, -170
    halign = center
    valign = center
}

# ── bottom-left: battery / power ─────────────────────────────
label {
    monitor =
    text = cmd[update:30000] $scripts/battery.sh
    font_family = JetBrainsMono Nerd Font
    font_size = 12
    color = rgba(ffffffcc)
    position = 40, 36
    halign = left
    valign = bottom
}

# ── bottom-centre: now playing ─────────────────────────────
label {
    monitor =
    text = cmd[update:2000] $scripts/nowplaying.sh
    font_family = $font_ui
    font_size = 12
    color = rgba(ffffffb3)
    position = 0, 36
    halign = center
    valign = bottom
}

# ── bottom-right: uptime ─────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "UP $(uptime -p | sed 's/up //; s/ hours\?/H/; s/ minutes\?/M/; s/ days\?/D/; s/,//g' | tr a-z A-Z)"
    font_family = $font_dot2
    font_size = 11
    color = rgba(ffffff80)
    position = -40, 36
    halign = right
    valign = bottom
}
