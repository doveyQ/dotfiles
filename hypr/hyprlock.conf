# hyprlock — macOS lock screen.  The ONLY locker: hypridle and every keybind call
# `loginctl lock-session` → hypridle → hyprlock.
# Colours + fonts: ~/.config/hypr/theme/hyprlock.conf (light / dark)

source = ~/.config/hypr/theme/hyprlock.conf
$scripts = ~/.config/hypr/scripts

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = fluid, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, fluid
    animation = fadeOut, 1, 3, fluid
    animation = inputFieldDots, 1, 2, fluid
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 9
    noise = 0.015
    brightness = $bg_brightness
    contrast = 1.0
    vibrancy = 0.3
}

# ── date (small, above the clock) ─────────────────────────────
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %-d %B"
    font_family = $font_display
    font_size = 22
    color = $fg_soft
    position = 0, 290
    halign = center
    valign = center
}

# ── large bold clock (SF Pro Rounded) ─────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +%-I:%M)</b>"
    font_family = $font_rounded
    font_size = 118
    color = $fg
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $shadow
    position = 0, 180
    halign = center
    valign = center
}

# ── greeting ─────────────────────────────
label {
    monitor =
    text = Hello, $USER
    font_family = $font_ui
    font_size = 13
    color = $fg_faint
    position = 0, -34
    halign = center
    valign = center
}

# ── password field (frosted pill) ─────────────────────────────
shape {
    monitor =
    size = 300, 46
    rounding = -1
    color = $surface
    border_size = 1
    border_color = $line
    position = 0, -100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 288, 36
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(00000000)
    inner_color = $field
    font_color = $fg
    font_family = $font_ui
    check_color = $accent
    fail_color = $alert
    capslock_color = $warn
    numlock_color = rgba(00000000)
    bothlock_color = $warn
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="$hex_dim">Enter Password</span>
    fail_text = <span foreground="$hex_alert">Wrong password · $ATTEMPTS</span>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

# ── keyboard layout chip (shows "at" — nodeadkeys) ─────────────────────────────
label {
    monitor =
    text = 󰌌  $LAYOUT
    font_family = $font_ui
    font_size = 11
    color = $fg_faint
    position = 0, -156
    halign = center
    valign = center
}

# ── bottom-left: battery / power ─────────────────────────────
label {
    monitor =
    text = cmd[update:30000] $scripts/battery.sh
    font_family = $font_mono
    font_size = 11
    color = $fg_soft
    position = 40, 36
    halign = left
    valign = bottom
}

# ── bottom-centre: now playing ─────────────────────────────
label {
    monitor =
    text = cmd[update:2000] $scripts/nowplaying.sh
    font_family = $font_ui
    font_size = 12
    color = $fg_soft
    position = 0, 36
    halign = center
    valign = bottom
}

# ── bottom-right: uptime ─────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "Up $(uptime -p | sed 's/up //; s/,//g')"
    font_family = $font_ui
    font_size = 11
    color = $fg_faint
    position = -40, 36
    halign = right
    valign = bottom
}
