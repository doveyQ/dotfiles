# Copenhagen palette for hyprlock — sourced by ~/.config/hypr/hyprlock.conf
# (Pango font lists: families separated by commas; a trailing comma keeps a
#  numeric family name from being read as the size.)

$font_ui      = SF Pro Text, Inter, Cantarell,
$font_display = SF Pro Display, Inter Display, Inter,
$font_mono    = SF Mono, JetBrains Mono, JetBrainsMono Nerd Font,

$fg       = rgba(e9e4daff)
$fg_soft  = rgba(e9e4dab3)
$fg_faint = rgba(e9e4da80)
$surface  = rgba(1e1c1a99)
$field    = rgba(2a2724cc)
$line     = rgba(e9e4da1a)
$accent   = rgba(9dad94ff)
$alert    = rgba(c4917aff)
$warn     = rgba(d8c6a5ff)
$shadow   = rgba(100d0b88)

# hex for <span foreground='…'> markup (## escapes the #)
$hex_dim   = ##a39c91
$hex_alert = ##c4917a
$hex_accent = ##9dad94
