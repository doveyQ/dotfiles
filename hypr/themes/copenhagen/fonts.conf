<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Copenhagen typography: Apple's SF families when installed, otherwise the closest
     free fonts. Included by ~/.config/fontconfig/fonts.conf, so every app (GTK, Qt,
     kitty, Pango in hyprlock/rofi) gets the same graceful fallback. -->
<fontconfig>
  <alias binding="same">
    <family>SF Pro Text</family>
    <accept><family>Inter</family><family>Cantarell</family></accept>
  </alias>
  <alias binding="same">
    <family>SF Pro Display</family>
    <accept><family>Inter Display</family><family>Inter</family><family>Cantarell</family></accept>
  </alias>
  <alias binding="same">
    <family>SF Mono</family>
    <accept><family>JetBrains Mono</family><family>JetBrainsMono Nerd Font Mono</family></accept>
  </alias>
</fontconfig>
