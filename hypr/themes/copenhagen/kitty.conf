# Copenhagen palette for kitty — included by ~/.config/kitty/kitty.conf
font_family  SF Mono
# (fontconfig/fonts.conf maps SF Mono → JetBrains Mono when it isn't installed)

foreground            #e2ddd3
background            #1e1c1a
selection_foreground  #1e1c1a
selection_background  #d8c6a5
cursor                #e9e4da
cursor_text_color     #1e1c1a
url_color             #9dad94
visual_bell_color     #c4917a
active_border_color   #a39c91
inactive_border_color #3a3632
mark1_background      #9dad94

active_tab_foreground   #1e1c1a
active_tab_background   #d8cfc0
inactive_tab_foreground #a39c91
inactive_tab_background #2a2724
tab_bar_background      #1e1c1a

# muted earth ANSI: clay · sage · sand · slate · heather · teal-grey
color0  #2a2724
color8  #5a554e
color1  #c4917a
color9  #d4a58f
color2  #9dad94
color10 #b3c1aa
color3  #d8c6a5
color11 #e6d8bd
color4  #8b9db0
color12 #a3b3c4
color5  #ad98a8
color13 #c2afbd
color6  #8fa9a4
color14 #a8bfba
color7  #d6d0c5
color15 #ece7de
