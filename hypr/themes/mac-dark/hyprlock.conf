$fg_faint = rgba(f5f5f799)
$surface  = rgba(ffffff26)
$field    = rgba(ffffff1f)
$line     = rgba(ffffff2e)
$accent   = rgba(0a84ffff)
$alert    = rgba(ff453aff)
$warn     = rgba(ff9f0aff)
$shadow   = rgba(00000055)
