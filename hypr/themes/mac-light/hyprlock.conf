# macOS Light — hyprlock palette. The lock screen keeps white type (as on macOS) over a
# brighter blurred desktop.
$font_ui      = SF Pro Text, Inter, Cantarell,
$font_display = SF Pro Display, Inter Display, Inter,
$font_rounded = SF Pro Rounded, SF Pro Display, Inter Display,
$font_mono    = SF Mono, JetBrains Mono, JetBrainsMono Nerd Font,

$fg       = rgba(ffffffff)
$fg_soft  = rgba(ffffffd9)
$fg_faint = rgba(ffffffa6)
$surface  = rgba(ffffff33)
$field    = rgba(ffffff2e)
$line     = rgba(ffffff40)
$accent   = rgba(007affff)
$alert    = rgba(ff3b30ff)
$warn     = rgba(ff9500ff)
$shadow   = rgba(00000040)
$bg_brightness = 0.8

$hex_dim    = ##f2f2f7
$hex_alert  = ##ff3b30
$hex_accent = ##007aff
