<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Apple's SF families when installed (scripts/install-sf-fonts.sh), otherwise the closest
     free fonts. Included by ~/.config/fontconfig/fonts.conf, so every app (GTK, Qt, kitty,
     Pango in hyprlock/rofi) gets the same graceful fallback. -->
<fontconfig>
  <alias binding="same">
    <family>SF Pro Text</family>
    <accept><family>SF Pro</family><family>Inter</family><family>Cantarell</family></accept>
  </alias>
  <alias binding="same">
    <family>SF Pro Display</family>
    <accept><family>SF Pro</family><family>Inter Display</family><family>Inter</family></accept>
  </alias>
  <alias binding="same">
    <family>SF Pro Rounded</family>
    <accept><family>SF Pro Display</family><family>Inter Display</family><family>Inter</family></accept>
  </alias>
  <alias binding="same">
    <family>SF Mono</family>
    <accept><family>JetBrains Mono</family><family>JetBrainsMono Nerd Font Mono</family></accept>
  </alias>
</fontconfig>
