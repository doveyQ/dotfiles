# hypridle — the single idle/lock authority. Everything locks through
# `loginctl lock-session`, which hypridle answers with hyprlock (never a second locker).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false       # videos / calls keep the screen awake
    inhibit_sleep = 3                 # wait for the lock screen before suspending
}

# 14:30 — heads-up
listener {
    timeout = 870
    on-timeout = notify-send -a Idle -u low "Locking in 30 seconds" "Move the mouse to stay awake"
}

# 15:00 — lock
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 15:30 — screens off
listener {
    timeout = 930
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 60:00 — suspend
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
