name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          pipx install ruff

      - name: make check
        run: make check
